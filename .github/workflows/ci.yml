name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on the same ref: a force-push, or a second push
# while the trunk matrix is still running, only needs the latest commit
# checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tier 2: the PR-path gate. rustfmt + clippy already need a full `cargo
  # build` of the workspace (clippy lints compiled code, and the sys crate's
  # build.rs compiles the vendored ggml/parakeet.cpp via cmake), so this one
  # job is also the cheapest check that proves the crate still builds on
  # Linux — measured 66s wall clock on this repo's own PR runner (run
  # 32013104850, job "lint (rustfmt + clippy)"), against 3m34s-6m54s for the
  # six-leg OS matrix below. Adding the Linux leg of that matrix on top would
  # have pushed the PR gate past the two-minute budget the three-tier model
  # asks for (build-ubuntu-latest-static alone measured 3m34s), so it stays
  # trunk-only; `preflight`'s own build+test check
  # (.github/preflight.json) covers the same ground locally before the push.
  #
  # Runs on every event (push and workflow_dispatch too, not gated by
  # `if:`): unlike the matrix, one Linux clippy build costs nothing extra on
  # push, and a regression here should fail loud on main as well.
  lint:
    name: lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (with vendored parakeet.cpp + ggml submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure rustfmt + clippy components
        run: rustup component add rustfmt clippy

      - name: rustfmt
        run: cargo fmt --all --check

      # clippy compiles the vendored ggml (CPU-only here; the GPU backends are
      # exercised by the build matrix). cmake + a C/C++ toolchain are needed.
      - name: Install build deps
        run: sudo apt-get update -y && sudo apt-get install -y cmake ninja-build build-essential

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Tier 3: main-only (and workflow_dispatch), the full six-leg matrix. None
  # of this is a PR author's problem before merge: `lint` above already
  # proves the crate builds and lints clean on Linux, and macOS/Windows only
  # exist as hosted runners — `preflight` cannot build either locally, so
  # push:main is the only place they are exercised at all (see
  # .github/preflight.json's `why` on the build-linux check).
  build:
    name: build-${{ matrix.os }}-${{ matrix.kind }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- static link (default) ---
          # macOS: Metal backend is auto-enabled by build.rs on target_os=macos.
          - os: macos-latest
            kind: static
            features: ""
          # Linux + Windows: GPU support via the Vulkan backend (ggml-vulkan).
          # Compile-only here (GPU-less runners) — shaders are compiled to SPIR-V
          # via glslc at build time; no VkInstance is created.
          - os: ubuntu-latest
            kind: static
            features: "--features vulkan"
          - os: windows-latest
            kind: static
            features: "--features vulkan"
          # --- dynamic backends (GGML_BACKEND_DL): backends as loadable modules ---
          # macOS: Metal still auto-on, built as a module.
          - os: macos-latest
            kind: dl
            features: "--features dynamic-backends"
          # Linux: DL + Vulkan so the Vulkan backend is built as a module. parakeet
          # calls ggml-cpu symbols directly; GNU ld defers them in the shared object
          # and the RTLD_GLOBAL ggml patch resolves them at load.
          - os: ubuntu-latest
            kind: dl
            features: "--features dynamic-backends,vulkan"
          # Windows: DL + Vulkan. The parakeet patch routes all CPU-backend access
          # through the ggml device registry (no direct ggml_backend_cpu_* symbol
          # references), so the shared parakeet/ggml core links cleanly under MSVC —
          # no `-undefined dynamic_lookup` equivalent needed. The CPU + Vulkan
          # backends ship as loadable modules, dlopen'd at runtime.
          - os: windows-latest
            kind: dl
            features: "--features dynamic-backends,vulkan"
    env:
      # Pin a known-good LunarG SDK version for Windows (see llama.cpp CI).
      VULKAN_VERSION: "1.4.313.2"
    steps:
      - name: Checkout (with vendored parakeet.cpp + ggml submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ggml-vulkan's CMake requires: the Vulkan loader+headers (find_package
      # Vulkan), the `glslc` SPIR-V compiler component, and SPIRV-Headers.
      - name: Install Vulkan build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y glslc libvulkan-dev spirv-headers cmake ninja-build build-essential

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK.exe" -L "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV  "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      # ggml-vulkan builds with the Ninja generator on Windows (see build.rs);
      # Ninja needs an MSVC dev environment (cl.exe on PATH) + ninja itself.
      - name: Setup MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja
        shell: pwsh

      # Windows MAX_PATH (260): the deeply nested cargo target + ggml-vulkan
      # ExternalProject + cmake TryCompile paths overflow it (C1041 "cannot open
      # program database"). A short CARGO_TARGET_DIR keeps paths under the limit.
      - name: Use a short target dir (Windows, avoid MAX_PATH)
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=C:\b" >> $env:GITHUB_ENV
        shell: pwsh

      # rust-toolchain.toml pins the channel; rustup on the runner honors it.
      - name: Cargo build (release)
        run: cargo build --release -p parakeet-cpp ${{ matrix.features }}

      # Non-gated tests (pure logic + ABI smoke). Model-dependent integration
      # tests skip without PARAKEET_TEST_* env, so this is GPU-less safe.
      - name: Cargo test
        run: cargo test --release -p parakeet-cpp -p parakeet-cpp-sys ${{ matrix.features }}

  # The single required status check. Never rename it: it is the one context
  # in the branch ruleset, so the jobs above can be renamed, split, or moved
  # between tiers forever without a ruleset edit. `skipped` counts as
  # passing — that is what makes a PR-path run, where `build` skips by
  # design, come out green.
  ci:
    name: ci
    if: always()
    needs: [lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A needed job failed or was cancelled
        run: |
          printf '%s\n' '${{ toJSON(needs) }}'
          printf '%s' '${{ toJSON(needs) }}' | jq -e '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | length == 0'
